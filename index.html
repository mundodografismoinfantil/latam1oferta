<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz Reto Baile Fit | 30 Días</title>
  <meta name="description" content="Descubre tu recomendación personalizada de baile fitness en casa para mujeres de 40+ años.">

  <!-- Google Fonts: Plus Jakarta Sans (Headings) & Inter (UI/Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#F72585',       // Rosa principal
              pinkSoft: '#FFF0F6',   // Rosa suave
              pinkHover: '#E01676',
              purple: '#65227C',     // Roxo elegante
              purpleDark: '#4A155C',
              lavender: '#F3E8FF',   // Lavanda
              coral: '#FF8A80',      // Coral suave
              canvas: '#FFFFFF',     // Fundo branco
              canvasSubtle: '#FAFAFC',
              textMain: '#292333',   // Texto principal
              textMuted: '#77717F',  // Texto secundário
              border: '#EFE8F0',     // Borda suave
              borderHover: '#E2D6E4'
            }
          },
          fontFamily: {
            heading: ['"Plus Jakarta Sans"', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          },
          boxShadow: {
            'card-subtle': '0 2px 14px -2px rgba(101, 34, 124, 0.05)',
            'card-hover': '0 6px 20px -2px rgba(101, 34, 124, 0.08)',
            'btn-pink': '0 6px 20px -2px rgba(247, 37, 133, 0.28)'
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFF9FB;
      color: #292333;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overflow-x: hidden;
      min-height: 100vh;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-scale-press {
      transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .custom-scale-press:active {
      transform: scale(0.975);
    }
    .fade-enter {
      animation: fadeIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pulse-cta {
      animation: ctaPulse 2.4s infinite ease-in-out;
    }
    @keyframes ctaPulse {
      0%, 100% {
        box-shadow: 0 8px 24px -2px rgba(247, 37, 133, 0.42);
        transform: translateY(0);
      }
      50% {
        box-shadow: 0 14px 32px 0px rgba(247, 37, 133, 0.62);
        transform: translateY(-1px);
      }
      /* Natural Fluid Rhythmic Ribbon Wave Animations */
    .ribbon-wave-1 {
      animation: ribbonDrift1 14s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes ribbonDrift1 {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-8px) rotate(0.8deg) scale(1.01); }
      100% { transform: translateY(4px) rotate(-0.5deg) scale(0.99); }
    }
    .ribbon-wave-2 {
      animation: ribbonDrift2 18s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes ribbonDrift2 {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(10px) rotate(-1deg) scale(1.015); }
      100% { transform: translateY(-6px) rotate(0.6deg) scale(0.985); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fade-enter, .pulse-cta, .ribbon-wave-1, .ribbon-wave-2, .animate-spin {
        animation: none !important;
        transition: none !important;
      }
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col items-center justify-start antialiased bg-white selection:bg-brand-pink selection:text-white">

  <!-- Ambient Natural Movement Background (Fluid Rhythmic Dance Ribbons & Harmonic Glows) -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 select-none" aria-hidden="true">
    
    <!-- Top & Side Soft Warm Ambient Glows -->
    <div class="absolute -top-32 -left-28 w-96 h-96 rounded-full bg-gradient-to-br from-pink-200/35 via-rose-100/15 to-transparent blur-3xl"></div>
    <div class="absolute top-1/4 -right-28 w-88 h-88 rounded-full bg-gradient-to-bl from-purple-200/25 via-pink-100/15 to-transparent blur-3xl"></div>
    <div class="absolute -bottom-24 -left-20 w-80 h-80 rounded-full bg-gradient-to-tr from-pink-200/25 via-amber-100/10 to-transparent blur-3xl"></div>

    <!-- Fluid Silk Ribbons / Dynamic Dance Waves (Full SVG viewport scaling) -->
    <svg class="absolute inset-0 w-full h-full" viewBox="0 0 1440 900" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Primary Vibrant Silk Ribbon Gradient (Brand Pink to Radiant Coral) -->
        <linearGradient id="silkRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F72585" stop-opacity="0.16"/>
          <stop offset="45%" stop-color="#FF5C8D" stop-opacity="0.10"/>
          <stop offset="75%" stop-color="#FF7043" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#FFA8C5" stop-opacity="0.02"/>
        </linearGradient>

        <!-- Secondary Lavender-Plum Fluid Wave Gradient -->
        <linearGradient id="silkRibbon2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#65227C" stop-opacity="0.12"/>
          <stop offset="40%" stop-color="#9C27B0" stop-opacity="0.07"/>
          <stop offset="70%" stop-color="#F72585" stop-opacity="0.09"/>
          <stop offset="100%" stop-color="#FFF0F5" stop-opacity="0.02"/>
        </linearGradient>

        <!-- Delicate Luminous Edge Highlight Gradients -->
        <linearGradient id="ribbonEdge1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F72585" stop-opacity="0.32"/>
          <stop offset="50%" stop-color="#FF8A80" stop-opacity="0.40"/>
          <stop offset="100%" stop-color="#65227C" stop-opacity="0.10"/>
        </linearGradient>

        <linearGradient id="ribbonEdge2" x1="100%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#BA68C8" stop-opacity="0.28"/>
          <stop offset="60%" stop-color="#F72585" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#FFA8CD" stop-opacity="0.08"/>
        </linearGradient>

        <!-- Bottom Ambient Rhythmic Ribbon (Bottom Wave) -->
        <linearGradient id="bottomRibbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#F72585" stop-opacity="0.13"/>
          <stop offset="50%" stop-color="#FF80AB" stop-opacity="0.07"/>
          <stop offset="100%" stop-color="#E0AAFF" stop-opacity="0.02"/>
        </linearGradient>
      </defs>

      <!-- Background Ribbon 2: Fluid Purple/Lavender Harmonic Wave -->
      <g class="ribbon-wave-2">
        <path d="M-100,250 C280,180 420,480 820,380 C1180,290 1320,520 1560,420 L1560,780 C1340,860 1100,680 760,760 C420,840 180,680 -100,740 Z" fill="url(#silkRibbon2)"/>
        <!-- Fine glowing contour line -->
        <path d="M-100,250 C280,180 420,480 820,380 C1180,290 1320,520 1560,420" stroke="url(#ribbonEdge2)" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- Foreground Ribbon 1: Dynamic Mexican Magenta/Coral Silk Streamer -->
      <g class="ribbon-wave-1">
        <path d="M-120,420 C180,320 380,620 740,540 C1080,460 1260,680 1580,580 L1580,950 C1280,1020 980,820 620,900 C260,980 80,840 -120,890 Z" fill="url(#silkRibbon1)"/>
        <!-- Fine glowing contour line -->
        <path d="M-120,420 C180,320 380,620 740,540 C1080,460 1260,680 1580,580" stroke="url(#ribbonEdge1)" stroke-width="2.2" stroke-linecap="round"/>
      </g>

      <!-- Bottom Fluid Ribbon Accent (Framing the bottom naturally) -->
      <path d="M-80,820 C240,760 520,880 880,810 C1200,750 1380,850 1540,820 L1540,920 L-80,920 Z" fill="url(#bottomRibbonGrad)"/>
      <path d="M-80,820 C240,760 520,880 880,810 C1200,750 1380,850 1540,820" stroke="url(#ribbonEdge1)" stroke-width="1.2" opacity="0.4"/>
    </svg>
  </div>

  <!-- Minimalist High-End Header (Apple/Notion Glassmorphism with Delicate Border) -->
  <header class="w-full bg-white/90 backdrop-blur-md border-b border-pink-100/70 sticky top-0 z-30 flex flex-col items-center shadow-[0_1px_8px_rgba(101,34,124,0.03)]">
    <div class="relative w-full max-w-[480px] px-4 py-1.5 flex items-center justify-between min-h-[64px] sm:min-h-[72px]">
      
      <!-- Back Button Left Column -->
      <div class="w-20 sm:w-24 flex justify-start z-10">
        <button 
          id="btn-back" 
          type="button" 
          aria-label="Volver a la pregunta anterior"
          class="h-8 sm:h-9 px-2.5 sm:px-3 rounded-full border border-pink-200/80 hover:border-brand-pink text-brand-purple hover:text-brand-pink text-xs font-semibold flex items-center gap-1.5 transition opacity-0 pointer-events-none custom-scale-press bg-white/90 shadow-2xs"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          <span>VOLVER</span>
        </button>
      </div>

      <!-- Center Official Logo (Mathematically Centered & Enlarged) -->
      <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center">
        <img 
          src="images/logo.jpg" 
          onerror="if(this.src.indexOf('images/')!==-1){this.src='logo.jpg';}else{this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.classList.remove('hidden');}"
          alt="Reto Baile FIT" 
          class="h-[56px] sm:h-[64px] w-auto object-contain transition-transform hover:scale-105"
        />
        <div class="hidden flex items-center gap-1.5 py-1 px-3 rounded-full bg-pink-50/90 border border-pink-200/80 text-brand-purple font-heading font-extrabold text-xs tracking-wide shadow-2xs">
          <span class="w-2 h-2 rounded-full bg-brand-pink animate-pulse"></span>
          <span>RETO BAILE <span class="text-brand-pink">FIT</span></span>
        </div>
      </div>

      <!-- Right Step Badge / Counter -->
      <div class="w-20 sm:w-24 flex justify-end z-10">
        <div id="header-counter" class="text-[11px] font-bold text-brand-purple px-2.5 py-1 rounded-full bg-brand-pinkSoft/90 border border-pink-200/70 shadow-2xs text-center min-w-[62px]">
          <span class="text-brand-pink font-extrabold" id="header-curr-step">1</span><span class="text-brand-textMuted font-normal"> / 15</span>
        </div>
      </div>
    </div>

    <!-- Fine Radiant Progress Bar with Glow -->
    <div id="progress-wrapper" class="w-full max-w-[480px] px-4 pb-2.5">
      <div class="flex items-center justify-between text-[11px] font-medium text-brand-textMuted mb-1.5">
        <span class="font-semibold text-brand-textMain flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-brand-pink inline-block"></span>
          Tu progreso
        </span>
        <span id="progress-text" class="text-brand-pink font-bold">7%</span>
      </div>
      <div class="w-full bg-brand-lavender/60 h-2 rounded-full overflow-hidden p-0.5 border border-pink-100/60">
        <div id="progress-bar" class="h-full rounded-full transition-all duration-300 ease-out bg-gradient-to-r from-brand-pink via-[#FF6584] to-brand-coral shadow-[0_0_8px_rgba(247,37,133,0.45)]" style="width: 7%;"></div>
      </div>
    </div>
  </header>

  <!-- Main Quiz Container (Mobile-First Safe Area Max 480px) -->
  <main class="w-full max-w-[480px] px-4 pt-3.5 pb-16 flex flex-col items-center relative z-10" style="padding-bottom: max(env(safe-area-inset-bottom, 20px), 36px);">

    <!-- Screen Mount Point -->
    <div id="screen-container" class="w-full flex flex-col items-center">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Security & Confidentiality Footer Card -->
    <div id="security-badge" class="w-full mt-7 px-4 py-3 bg-white/90 backdrop-blur-sm rounded-2xl border border-pink-100/90 shadow-card-subtle flex items-center gap-3 text-left">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-pinkSoft to-brand-lavender text-brand-purple flex items-center justify-center shrink-0 border border-pink-100">
        <svg class="w-4 h-4 text-brand-pink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div>
        <h4 class="text-xs font-bold text-brand-textMain leading-tight flex items-center gap-1.5">
          <span>100% seguro y confidencial</span>
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        </h4>
        <p class="text-[11px] text-brand-textMuted leading-snug mt-0.5">
          Tus respuestas se procesan de forma privada para adaptar tu experiencia.
        </p>
      </div>
    </div>

    <footer class="text-[11px] text-brand-textMuted text-center mt-4 leading-relaxed">
      Reto Baile Fit — 30 Días • Especial para mujeres de 40+ años en México
    </footer>

  </main>

  <!-- Script Engine & Design System -->
  <script>
    // --- Safe Analytics (Strict Privacy: Never send sensitive weight/health data) ---
    const Analytics = {
      track: function(eventName, data = {}) {
        const clean = { ...data };
        delete clean.peso_actual;
        delete clean.peso_deseado;
        delete clean.altura;
        delete clean.peso;
        delete clean.molestias;
        console.log(`[Analytics: ${eventName}]`, clean);
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ event: eventName, ...clean });
      }
    };

    // --- Exclusive Vector SVG Icon Library (15 Mandatory Brand Icons + Utilities) ---
    const Icons = {
      // 1. Dance: Dancing woman movement silhouette
      dance: (cls = "w-5 h-5") => `

      bolt: (cls = "w-3.5 h-3.5") => `

      `,
      arrowRight: (cls = "w-4 h-4") => `

        const submitNumber = () => {
          let raw = inp ? inp.value.trim().replace(',', '.').replace(/[^\d.]/g, '') : '';

            advance(idx);
            return;

          // Auto-convert meters to cm if user typed 1.60 instead of 160

            val = Math.round(val * 100);

          if (val < q.min || val > q.max) {
            err.textContent = `Ingresa un valor aproximado entre ${q.min} y ${q.max} ${q.unit} (o pulsa saltar).`;

          state.answers[q.id] = `${val} ${q.unit}`;

          advance(idx);

        if (inp) {

                ${Icons.shield('w-3.5 h-3.5 text-emerald-600')}
                <span>Garantía 7 Días</span>
              </span>
            </div>
          </div>

          <!-- Restart Quiz Button -->
          <button 
            id="btn-restart" 
            type="button" 
            class="text-xs text-brand-textMuted hover:text-brand-pink underline py-2.5 transition font-medium"
          >
            Volver a realizar el cuestionario desde la pregunta 1
          </button>

        </div>
      `;

      const btnOffer = document.getElementById('btn-main-offer');
      if (btnOffer) {
        btnOffer.addEventListener('click', () => {
          Analytics.track('sales_page_viewed', {
            nivel: data.nivel,
            tiempo: data.tiempo
          });
        });
      }

      const btnReset = document.getElementById('btn-restart');
      if (btnReset) {
        btnReset.addEventListener('click', () => {
          state = { ...defaultState };
          saveState(state);
          render();
        });
      }
    } catch (err) {
      console.error('Error rendering result:', err);
    }
  }

    // --- Main Router ---
    function render() {
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (typeof state.step === 'number' && state.step >= 1 && state.step <= 15) {
        renderQuestion(state.step);
      } else if (state.step === 'processing') {
        renderProcessing();
      } else if (state.step === 'result') {
        renderResult();
      } else {
        state.step = 1;
        renderQuestion(1);
      }
    }

    // Initialize App
    render();
  </script>
</body>
</html>
